<!DOCTYPE html>
<!-- Declara que el documento es HTML5 -->
<html lang="es">
<!-- Etiqueta raíz del documento, con idioma español -->
<head>
  <!-- Codificación de caracteres UTF-8 para acentos y emojis -->
  <meta charset="UTF-8">
  <!-- Ajusta el ancho al dispositivo (mobile first) y respeta el notch con viewport-fit -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Color de la barra del navegador en móviles -->
  <meta name="theme-color" content="#000000">
  <!-- Evita que el navegador envíe la URL (con el ID) como referer a otros sitios -->
  <meta name="referrer" content="no-referrer">
  <!-- Título de la pestaña -->
  <title>Yarareando · Chat efímero P2P</title>

  <!-- Carga la librería PeerJS desde unpkg (se usa solo para el signaling WebRTC) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <!-- Inicio de los estilos inline -->
  <style>
    /* Variables de color y medidas reutilizables */
    :root {
      /* Fondo general negro puro */
      --fondo: #000000;
      /* Fondo de paneles y del input */
      --panel: #1c1c1e;
      /* Borde sutil de los paneles */
      --borde: #2c2c2e;
      /* Color de texto principal */
      --texto: #f2f2f7;
      /* Color de texto secundario (grisáceo) */
      --texto-suave: #8e8e93;
      /* Azul de las burbujas propias, estilo iMessage */
      --azul: #0a84ff;
      /* Gris de las burbujas del otro usuario */
      --gris: #3a3a3c;
      /* Verde para el estado "conectado" */
      --verde: #30d158;
      /* Rojo para errores o desconexión */
      --rojo: #ff453a;
      /* Naranja para el estado "esperando" y el fuego */
      --naranja: #ff9f0a;
    }

    /* Hace que padding y borde se incluyan en el ancho de todos los elementos */
    *, *::before, *::after {
      /* Modelo de caja más predecible */
      box-sizing: border-box;
    }

    /* Estilos del html y del body */
    html, body {
      /* Quita el margen por defecto */
      margin: 0;
      /* Ocupa toda la altura disponible */
      height: 100%;
      /* Fondo negro (dark mode) */
      background: var(--fondo);
      /* Texto claro */
      color: var(--texto);
      /* Fuente del sistema, igual que iOS/Android */
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      /* Suaviza las fuentes en macOS/iOS */
      -webkit-font-smoothing: antialiased;
      /* Quita el resaltado azul al tocar en móviles */
      -webkit-tap-highlight-color: transparent;
    }

    /* Contenedor principal de la app */
    .app {
      /* Organiza los hijos en columna */
      display: flex;
      /* Dirección vertical: cabecera, mensajes, input */
      flex-direction: column;
      /* Altura dinámica real en móviles (descuenta la barra del navegador) */
      height: 100dvh;
      /* Ancho máximo para que en escritorio quede centrado como un teléfono */
      max-width: 480px;
      /* Centra horizontalmente */
      margin: 0 auto;
      /* Espacio interno respetando las zonas seguras (notch) */
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }

    /* Cabecera superior */
    .cabecera {
      /* Centra el texto */
      text-align: center;
      /* Espacio arriba y abajo */
      padding: 16px 0 8px;
    }

    /* Título de la app */
    .cabecera h1 {
      /* Sin margen extra */
      margin: 0;
      /* Sin espacio de línea debajo de la imagen */
      line-height: 0;
    }

    /* Logo de Yarareando */
    .logo {
      /* Ocupa su propia línea */
      display: block;
      /* Ancho que se adapta a la pantalla: entre 110 y 160 píxeles */
      width: clamp(110px, 34vw, 160px);
      /* Alto proporcional */
      height: auto;
      /* Centrado horizontal */
      margin: 0 auto;
      /* No se puede seleccionar */
      user-select: none;
      /* Se achica suavemente cuando hay conexión */
      transition: width 0.3s ease;
    }

    /* Con el chat conectado, el logo se achica para dejar más lugar al mensaje */
    .app.en-charla .logo {
      /* Más chico */
      width: clamp(72px, 22vw, 96px);
    }

    /* Subtítulo debajo del logo */
    .subtitulo {
      /* Texto pequeño */
      font-size: 13px;
      /* Semi-negrita */
      font-weight: 600;
      /* Color gris */
      color: var(--texto-suave);
      /* Poco margen */
      margin: 4px 0 6px;
    }

    /* Línea de estado (conectando / conectado / etc.) */
    .estado {
      /* Muestra punto y texto en línea */
      display: inline-flex;
      /* Alinea verticalmente punto y texto */
      align-items: center;
      /* Separación entre punto y texto */
      gap: 6px;
      /* Texto pequeño */
      font-size: 13px;
      /* Color gris */
      color: var(--texto-suave);
    }

    /* Puntito de color del estado */
    .estado .punto {
      /* Ancho del punto */
      width: 8px;
      /* Alto del punto */
      height: 8px;
      /* Lo hace circular */
      border-radius: 50%;
      /* Por defecto naranja (esperando) */
      background: var(--naranja);
    }

    /* Punto verde cuando hay conexión */
    .estado.conectado .punto {
      /* Color verde */
      background: var(--verde);
      /* Brillo verde alrededor */
      box-shadow: 0 0 8px var(--verde);
    }

    /* Texto verde cuando hay conexión */
    .estado.conectado {
      /* Color del texto */
      color: var(--verde);
    }

    /* Punto rojo cuando hay error o desconexión */
    .estado.error .punto {
      /* Color rojo */
      background: var(--rojo);
    }

    /* Texto rojo cuando hay error */
    .estado.error {
      /* Color del texto */
      color: var(--rojo);
    }

    /* Panel que muestra el link para invitar */
    .panel-link {
      /* Fondo gris oscuro */
      background: var(--panel);
      /* Borde sutil */
      border: 1px solid var(--borde);
      /* Esquinas redondeadas */
      border-radius: 16px;
      /* Espacio interno */
      padding: 14px;
      /* Separación con la cabecera */
      margin-top: 8px;
      /* Centra el contenido */
      text-align: center;
    }

    /* Clase para ocultar cualquier elemento */
    .oculto {
      /* No se muestra ni ocupa espacio */
      display: none !important;
    }

    /* Texto "Tu link para chatear:" */
    .panel-link p {
      /* Sin margen superior y poco inferior */
      margin: 0 0 8px;
      /* Tamaño pequeño */
      font-size: 13px;
      /* Color gris */
      color: var(--texto-suave);
    }

    /* Caja donde aparece la URL */
    .url {
      /* Fuente monoespaciada para leer bien el ID */
      font-family: ui-monospace, Menlo, Consolas, monospace;
      /* Tamaño pequeño */
      font-size: 12px;
      /* Corta la URL en cualquier punto para que no desborde */
      word-break: break-all;
      /* Fondo negro */
      background: #000;
      /* Esquinas redondeadas */
      border-radius: 10px;
      /* Espacio interno */
      padding: 10px;
      /* Permite seleccionar todo el texto con un clic */
      user-select: all;
      /* Separación con el botón */
      margin-bottom: 10px;
    }

    /* Botones genéricos */
    button {
      /* Usa la misma fuente que el resto */
      font: inherit;
      /* Sin borde */
      border: none;
      /* Cursor de mano */
      cursor: pointer;
    }

    /* Botón "Copiar link" */
    .btn-copiar {
      /* Fondo azul */
      background: var(--azul);
      /* Texto blanco */
      color: #fff;
      /* Forma de píldora */
      border-radius: 999px;
      /* Espacio interno */
      padding: 8px 18px;
      /* Tamaño del texto */
      font-size: 14px;
      /* Semi-negrita */
      font-weight: 600;
    }

    /* Zona central donde aparece el único mensaje visible */
    .escenario {
      /* Ocupa todo el espacio sobrante */
      flex: 1;
      /* Flex para posicionar la burbuja */
      display: flex;
      /* Apila en columna */
      flex-direction: column;
      /* La burbuja se pega abajo, como en iMessage */
      justify-content: flex-end;
      /* Sin scroll: solo existe 1 mensaje a la vez */
      overflow: hidden;
      /* Espacio arriba y abajo */
      padding: 16px 0;
      /* Contexto para posicionar el texto vacío */
      position: relative;
    }

    /* Texto que se ve cuando no hay mensajes */
    .vacio {
      /* Lo posiciona en el centro del escenario */
      position: absolute;
      /* Ocupa todo el escenario */
      inset: 0;
      /* Flex para centrar */
      display: flex;
      /* Centrado vertical */
      align-items: center;
      /* Centrado horizontal */
      justify-content: center;
      /* Texto centrado */
      text-align: center;
      /* Color gris */
      color: var(--texto-suave);
      /* Texto pequeño */
      font-size: 14px;
      /* Interlineado cómodo */
      line-height: 1.5;
      /* No intercepta clics */
      pointer-events: none;
      /* Espacio lateral */
      padding: 0 24px;
    }

    /* Burbuja de mensaje (base) */
    .burbuja {
      /* Contexto para la cuenta regresiva y la barra */
      position: relative;
      /* Ancho máximo del 80% como en iMessage */
      max-width: 80%;
      /* Espacio interno (derecha extra para el contador) */
      padding: 10px 44px 14px 14px;
      /* Esquinas muy redondeadas */
      border-radius: 20px;
      /* Tamaño de texto legible en móvil */
      font-size: 17px;
      /* Interlineado */
      line-height: 1.35;
      /* Corta palabras largas para no desbordar */
      overflow-wrap: anywhere;
      /* Respeta saltos de línea del texto */
      white-space: pre-wrap;
      /* Oculta lo que sobresale (barra de progreso) */
      overflow: hidden;
      /* Animación de entrada */
      animation: aparecer 0.25s ease-out;
    }

    /* Burbuja propia: azul y a la derecha */
    .burbuja.mia {
      /* Se alinea a la derecha */
      align-self: flex-end;
      /* Fondo azul */
      background: var(--azul);
      /* Texto blanco */
      color: #fff;
      /* Esquina inferior derecha casi recta (colita) */
      border-bottom-right-radius: 6px;
    }

    /* Burbuja del otro: gris y a la izquierda */
    .burbuja.suya {
      /* Se alinea a la izquierda */
      align-self: flex-start;
      /* Fondo gris */
      background: var(--gris);
      /* Texto claro */
      color: var(--texto);
      /* Esquina inferior izquierda casi recta (colita) */
      border-bottom-left-radius: 6px;
    }

    /* Número de la cuenta regresiva dentro de la burbuja */
    .contador {
      /* Posición absoluta dentro de la burbuja */
      position: absolute;
      /* Distancia desde arriba */
      top: 8px;
      /* Distancia desde la derecha */
      right: 10px;
      /* Ancho del círculo */
      width: 24px;
      /* Alto del círculo */
      height: 24px;
      /* Círculo */
      border-radius: 50%;
      /* Fondo semitransparente oscuro */
      background: rgba(0, 0, 0, 0.25);
      /* Flex para centrar el número */
      display: flex;
      /* Centrado vertical */
      align-items: center;
      /* Centrado horizontal */
      justify-content: center;
      /* Tamaño del número */
      font-size: 12px;
      /* Negrita */
      font-weight: 700;
      /* Números de ancho fijo para que no "salten" */
      font-variant-numeric: tabular-nums;
    }

    /* Cuando quedan 2 segundos o menos el contador se pone naranja */
    .contador.urgente {
      /* Fondo naranja */
      background: var(--naranja);
      /* Texto negro para contraste */
      color: #000;
      /* Pequeño latido */
      animation: latido 1s ease-in-out infinite;
    }

    /* Barra de progreso que se vacía en 5 segundos */
    .barra {
      /* Posición absoluta en la parte inferior */
      position: absolute;
      /* Pegada al fondo */
      bottom: 0;
      /* Desde el borde izquierdo */
      left: 0;
      /* Alto de la barra */
      height: 3px;
      /* Empieza llena */
      width: 100%;
      /* Blanco semitransparente */
      background: rgba(255, 255, 255, 0.55);
      /* Se encoge desde la izquierda */
      transform-origin: left;
      /* Animación lineal de 5 segundos */
      animation: vaciar 5s linear forwards;
    }

    /* Clase que dispara la animación de quemado */
    .burbuja.quemando {
      /* Animación de quemado de 0.9 segundos */
      animation: quemar 0.9s ease-in forwards;
      /* Evita clics durante el quemado */
      pointer-events: none;
    }

    /* Versión rápida del quemado (cuando llega un mensaje nuevo) */
    .burbuja.quemando.rapido {
      /* Misma animación pero más corta */
      animation-duration: 0.35s;
    }

    /* Capa de fuego que aparece encima de la burbuja al quemarse */
    .burbuja.quemando::after {
      /* Pseudo-elemento vacío */
      content: "";
      /* Cubre toda la burbuja */
      position: absolute;
      /* De borde a borde */
      inset: 0;
      /* Degradado de brasas desde abajo */
      background: linear-gradient(to top, #ff3b00 0%, #ff9f0a 35%, rgba(255, 214, 10, 0.4) 60%, transparent 85%);
      /* Mezcla el fuego con el color de la burbuja */
      mix-blend-mode: screen;
      /* El fuego sube */
      animation: llamas 0.9s ease-in forwards;
    }

    /* Animación de entrada de la burbuja */
    @keyframes aparecer {
      /* Empieza pequeña e invisible */
      from { opacity: 0; transform: translateY(12px) scale(0.92); }
      /* Termina en su tamaño normal */
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Animación de la barra de progreso */
    @keyframes vaciar {
      /* Llena */
      from { transform: scaleX(1); }
      /* Vacía */
      to { transform: scaleX(0); }
    }

    /* Latido del contador urgente */
    @keyframes latido {
      /* Tamaño normal al inicio y al final */
      0%, 100% { transform: scale(1); }
      /* Se agranda en la mitad */
      50% { transform: scale(1.18); }
    }

    /* Animación de quemado: brillo, color fuego, desenfoque y desaparición */
    @keyframes quemar {
      /* Estado inicial: normal */
      0% { opacity: 1; filter: none; transform: scale(1); }
      /* Se enciende: más brillo y tono anaranjado */
      30% { filter: brightness(1.6) sepia(1) saturate(4) hue-rotate(-20deg); transform: scale(1.03); }
      /* Se carboniza: oscuro y desenfocado */
      70% { opacity: 0.6; filter: brightness(0.5) sepia(1) saturate(3) blur(2px); transform: scale(0.97) translateY(-6px); }
      /* Ceniza: desaparece hacia arriba */
      100% { opacity: 0; filter: brightness(0) blur(8px); transform: scale(0.85) translateY(-24px); }
    }

    /* Animación de las llamas subiendo */
    @keyframes llamas {
      /* Empiezan abajo */
      from { transform: translateY(100%); opacity: 0.2; }
      /* Cubren la burbuja */
      to { transform: translateY(-10%); opacity: 1; }
    }

    /* Barra inferior con el input */
    .barra-input {
      /* Contexto para posicionar el indicador de grabación y los avisos */
      position: relative;
      /* Elementos en fila */
      display: flex;
      /* Separación entre input y botón */
      gap: 8px;
      /* Alinea abajo */
      align-items: flex-end;
      /* Espacio inferior */
      padding: 8px 0 12px;
    }

    /* Campo de texto */
    .barra-input input {
      /* Ocupa todo el ancho posible */
      flex: 1;
      /* Ancho mínimo cero para que flex funcione bien */
      min-width: 0;
      /* Fondo gris oscuro */
      background: var(--panel);
      /* Borde sutil */
      border: 1px solid var(--borde);
      /* Texto claro */
      color: var(--texto);
      /* Forma de píldora */
      border-radius: 999px;
      /* Espacio interno */
      padding: 10px 16px;
      /* 16px evita el zoom automático en iOS */
      font-size: 16px;
      /* Sin contorno por defecto */
      outline: none;
    }

    /* Borde azul cuando el input tiene foco */
    .barra-input input:focus {
      /* Color del borde */
      border-color: var(--azul);
    }

    /* Input deshabilitado (sin conexión) */
    .barra-input input:disabled {
      /* Más transparente */
      opacity: 0.5;
    }

    /* Botón de enviar redondo */
    .btn-enviar {
      /* Ancho fijo */
      width: 40px;
      /* Alto fijo */
      height: 40px;
      /* No se encoge */
      flex-shrink: 0;
      /* Círculo */
      border-radius: 50%;
      /* Fondo azul */
      background: var(--azul);
      /* Flecha blanca */
      color: #fff;
      /* Flex para centrar el ícono */
      display: flex;
      /* Centrado vertical */
      align-items: center;
      /* Centrado horizontal */
      justify-content: center;
    }

    /* Botón deshabilitado */
    .btn-enviar:disabled {
      /* Fondo gris */
      background: var(--gris);
      /* Cursor de prohibido */
      cursor: not-allowed;
    }

    /* ===================== AUDIO ===================== */

    /* Botón de micrófono (mantener apretado para grabar) y botón de foto */
    .btn-micro, .btn-foto {
      /* Ancho fijo */
      width: 40px;
      /* Alto fijo */
      height: 40px;
      /* No se encoge */
      flex-shrink: 0;
      /* Círculo */
      border-radius: 50%;
      /* Fondo gris para diferenciarlo de enviar */
      background: var(--gris);
      /* Ícono blanco */
      color: #fff;
      /* Flex para centrar el ícono */
      display: flex;
      /* Centrado vertical */
      align-items: center;
      /* Centrado horizontal */
      justify-content: center;
      /* Evita que el navegador haga scroll o zoom al mantener apretado */
      touch-action: none;
      /* Evita que se seleccione texto al mantener apretado */
      user-select: none;
      /* Evita el menú de "copiar/guardar" de iOS al mantener apretado */
      -webkit-touch-callout: none;
      /* Transición suave al agrandarse */
      transition: transform 0.15s, background 0.15s;
    }

    /* Botón de micrófono mientras se graba */
    .btn-micro.grabando {
      /* Fondo rojo */
      background: var(--rojo);
      /* Se agranda para que se note bajo el dedo */
      transform: scale(1.25);
    }

    /* Botones de micrófono y foto deshabilitados */
    .btn-micro:disabled, .btn-foto:disabled {
      /* Más transparente */
      opacity: 0.5;
      /* Cursor de prohibido */
      cursor: not-allowed;
    }

    /* Indicador "grabando" que tapa el input mientras se graba */
    .indicador-grabacion {
      /* Posición absoluta dentro de la barra del input */
      position: absolute;
      /* Mismo margen superior que la barra */
      top: 8px;
      /* Mismo margen inferior que la barra */
      bottom: 12px;
      /* Desde el borde izquierdo */
      left: 0;
      /* Deja libres los tres botones de la derecha (3 × 40 + separaciones) */
      right: 144px;
      /* Fondo igual al input */
      background: var(--panel);
      /* Borde rojo para indicar grabación */
      border: 1px solid var(--rojo);
      /* Forma de píldora */
      border-radius: 999px;
      /* Elementos en fila */
      display: flex;
      /* Centrado vertical */
      align-items: center;
      /* Separación entre punto, tiempo y ayuda */
      gap: 8px;
      /* Espacio interno lateral */
      padding: 0 16px;
      /* Tamaño de texto */
      font-size: 15px;
      /* No intercepta toques (el dedo sigue sobre el micrófono) */
      pointer-events: none;
    }

    /* Punto rojo que parpadea mientras se graba */
    .indicador-grabacion .punto-rojo {
      /* Ancho */
      width: 10px;
      /* Alto */
      height: 10px;
      /* Círculo */
      border-radius: 50%;
      /* Rojo */
      background: var(--rojo);
      /* Parpadeo continuo */
      animation: parpadeo 1s ease-in-out infinite;
    }

    /* Tiempo de grabación */
    .indicador-grabacion .tiempo {
      /* Números de ancho fijo */
      font-variant-numeric: tabular-nums;
      /* Negrita */
      font-weight: 600;
    }

    /* Texto de ayuda "deslizá para cancelar" */
    .indicador-grabacion .ayuda {
      /* Empuja la ayuda hacia la derecha */
      margin-left: auto;
      /* Color gris */
      color: var(--texto-suave);
      /* Texto pequeño */
      font-size: 13px;
      /* No corta en dos líneas */
      white-space: nowrap;
    }

    /* Aviso flotante breve (permiso denegado, audio muy corto, etc.) */
    .aviso {
      /* Posición absoluta sobre la barra del input */
      position: absolute;
      /* Justo encima de la barra */
      bottom: 64px;
      /* Centrado horizontal */
      left: 50%;
      /* Corrige el centrado */
      transform: translateX(-50%);
      /* Fondo gris oscuro */
      background: var(--panel);
      /* Borde sutil */
      border: 1px solid var(--borde);
      /* Texto claro */
      color: var(--texto);
      /* Forma de píldora */
      border-radius: 999px;
      /* Espacio interno */
      padding: 8px 14px;
      /* Texto pequeño */
      font-size: 13px;
      /* No corta en dos líneas */
      white-space: nowrap;
      /* No intercepta toques */
      pointer-events: none;
      /* Animación de entrada */
      animation: aparecer 0.2s ease-out;
    }

    /* Botón "Escuchar" (audio) y "Ver foto" dentro de la burbuja */
    .btn-escuchar {
      /* Fondo oscuro semitransparente */
      background: rgba(0, 0, 0, 0.25);
      /* Mismo color de texto que la burbuja */
      color: inherit;
      /* Forma de píldora */
      border-radius: 999px;
      /* Espacio interno */
      padding: 6px 14px;
      /* Tamaño del texto */
      font-size: 15px;
      /* Semi-negrita */
      font-weight: 600;
    }

    /* Botón "Escuchar" ya usado */
    .btn-escuchar:disabled {
      /* Cursor normal */
      cursor: default;
    }

    /* Nota "Se escucha una sola vez" */
    .nota-audio {
      /* En su propia línea */
      display: block;
      /* Texto pequeño */
      font-size: 12px;
      /* Más tenue */
      opacity: 0.7;
      /* Separación con el botón */
      margin-top: 6px;
    }

    /* Foto efímera dentro de la burbuja */
    .foto-efimera {
      /* Ocupa su propia línea */
      display: block;
      /* No más ancha que la burbuja */
      max-width: 100%;
      /* No más alta que el 60% de la pantalla */
      max-height: 60dvh;
      /* Esquinas redondeadas */
      border-radius: 14px;
      /* No se puede seleccionar */
      user-select: none;
      /* No se puede arrastrar (Safari/Chrome) */
      -webkit-user-drag: none;
      /* Sin menú "Guardar imagen" al mantener apretado en iOS */
      -webkit-touch-callout: none;
      /* No recibe toques: no hay menú contextual ni arrastre sobre la imagen */
      pointer-events: none;
      /* Oculta mientras no se mantenga apretado */
      visibility: hidden;
    }

    /* ===================== ANTI-CAPTURA ===================== */

    /* Marco de la foto: la zona que hay que mantener apretada */
    .marco-foto {
      /* Contexto para posicionar la tapa encima */
      position: relative;
      /* Tamaño mínimo mientras la foto carga */
      min-width: 180px;
      /* Alto mínimo mientras la foto carga */
      min-height: 120px;
      /* Esquinas redondeadas */
      border-radius: 14px;
      /* Recorta la tapa a las esquinas */
      overflow: hidden;
      /* Fondo negro debajo de la foto */
      background: #000;
      /* Sin scroll ni zoom al mantener apretado */
      touch-action: none;
      /* No se puede seleccionar */
      user-select: none;
      /* Igual en Safari */
      -webkit-user-select: none;
      /* Sin menú de iOS al mantener apretado */
      -webkit-touch-callout: none;
      /* Cursor de mano */
      cursor: pointer;
      /* Sin contorno azul al enfocar con el teclado (se marca con el borde) */
      outline: none;
    }

    /* Borde visible cuando se enfoca con el teclado */
    .marco-foto:focus-visible {
      /* Borde azul */
      box-shadow: 0 0 0 2px var(--azul);
    }

    /* Mientras se mantiene apretado, la foto se ve */
    .marco-foto.viendo .foto-efimera {
      /* Visible */
      visibility: visible;
    }

    /* Tapa que cubre la foto */
    .tapa-foto {
      /* Cubre todo el marco */
      position: absolute;
      /* De borde a borde */
      inset: 0;
      /* Flex para centrar el texto */
      display: flex;
      /* Centrado vertical */
      align-items: center;
      /* Centrado horizontal */
      justify-content: center;
      /* Texto centrado */
      text-align: center;
      /* Espacio interno */
      padding: 12px;
      /* Tamaño de texto */
      font-size: 15px;
      /* Semi-negrita */
      font-weight: 600;
      /* Fondo oscuro con un toque de color */
      background: linear-gradient(135deg, #2c2c2e, #1c1c1e);
      /* Texto blanco */
      color: #fff;
    }

    /* Mientras se mantiene apretado, la tapa desaparece */
    .marco-foto.viendo .tapa-foto {
      /* Oculta */
      display: none;
    }

    /* Si la ventana pierde el foco (posible captura o cambio de app), se desenfocan los mensajes */
    body.desenfocado .burbuja {
      /* Desenfoque fuerte */
      filter: blur(16px);
    }

    /* Y si había una foto destapada, se vuelve a tapar */
    body.desenfocado .marco-foto .foto-efimera {
      /* Oculta */
      visibility: hidden;
    }

    /* Y la tapa vuelve a aparecer */
    body.desenfocado .marco-foto .tapa-foto {
      /* Visible */
      display: flex;
    }

    /* Parpadeo del punto rojo de grabación */
    @keyframes parpadeo {
      /* Visible al inicio y al final */
      0%, 100% { opacity: 1; }
      /* Casi invisible en la mitad */
      50% { opacity: 0.2; }
    }

    /* Respeta a quien pidió menos animaciones en su sistema */
    @media (prefers-reduced-motion: reduce) {
      /* Reduce la duración de casi todas las animaciones */
      .burbuja, .burbuja.quemando, .burbuja.quemando::after, .contador.urgente {
        /* Casi instantáneo */
        animation-duration: 0.01s !important;
      }
    }
  </style>
  <!-- Fin de los estilos -->
</head>

      <p class="subtitulo">🔥 Chat efímero P2P</p>
      <!-- Indicador de estado; aria-live hace que los lectores de pantalla lo anuncien -->
      <div id="estado" class="estado" aria-live="polite">
        <!-- Puntito de color -->
        <span class="punto"></span>
        <!-- Texto del estado -->
        <span id="estado-texto">Iniciando…</span>
      </div>
    </header>

    <!-- Panel con el link de invitación (oculto hasta tener ID) -->
    <section id="panel-link" class="panel-link oculto">
      <!-- Texto explicativo pedido en el enunciado -->
      <p>Tu link para chatear:</p>
      <!-- Aquí se escribe la URL con ?join=ID -->
      <div id="url" class="url"></div>
      <!-- Botón para copiar o compartir el link -->
      <button id="btn-copiar" class="btn-copiar" type="button">Copiar link</button>
    </section>

    <!-- Escenario donde vive el único mensaje visible -->
    <section id="escenario" class="escenario" aria-live="polite">
      <!-- Texto que se muestra cuando no hay mensajes -->
      <div id="vacio" class="vacio">Compartí el link y esperá a que alguien se conecte.<br>Nada se guarda. Nada queda.</div>
    </section>

    <!-- Formulario de envío -->
    <form id="formulario" class="barra-input" autocomplete="off">
      <!-- Campo de texto (deshabilitado hasta conectar) -->
      <input id="entrada" type="text" placeholder="Mensaje…" maxlength="500" disabled aria-label="Escribir mensaje">
      <!-- Indicador que aparece encima del input mientras se graba un audio (oculto al inicio) -->
      <div id="indicador-grabacion" class="indicador-grabacion oculto" aria-live="polite">
        <!-- Punto rojo que parpadea -->
        <span class="punto-rojo"></span>
        <!-- Tiempo grabado, por ejemplo 0:05 -->
        <span id="tiempo-grabacion" class="tiempo">0:00</span>
        <!-- Ayuda para cancelar -->
        <span class="ayuda">◀ deslizá para cancelar</span>
      </div>
      <!-- Aviso breve (permiso denegado, audio muy corto, etc.) -->
      <div id="aviso" class="aviso oculto" role="status"></div>
      <!-- Selector de archivo oculto: en el celular ofrece cámara o galería -->
      <input id="selector-foto" type="file" accept="image/*" hidden>
      <!-- Botón de foto: abre el selector -->
      <button id="btn-foto" class="btn-foto" type="button" disabled aria-label="Enviar una foto que se ve una sola vez">
        <!-- Ícono SVG de cámara -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <!-- Botón de micrófono: mantener apretado para grabar, soltar para enviar -->
      <button id="btn-micro" class="btn-micro" type="button" disabled aria-label="Mantené apretado para grabar un audio">
        <!-- Ícono SVG de micrófono -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
      </button>
      <!-- Botón enviar con ícono de flecha -->
      <button id="btn-enviar" class="btn-enviar" type="submit" disabled aria-label="Enviar">
        <!-- Ícono SVG de flecha hacia arriba -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </main>

  <!-- Inicio de la lógica de la app -->
  <script>
    // Modo estricto: el navegador avisa de errores silenciosos
    'use strict';

    // ===================== CONSTANTES =====================

    // Segundos que vive cada mensaje antes de autodestruirse
    const SEGUNDOS_DE_VIDA = 5;
    // Largo máximo permitido para un mensaje (también se valida al recibir)
    const LARGO_MAXIMO = 500;
    // Señal interna que se envía al cerrar la pestaña (con caracteres que el input no genera)
    const SENAL_ADIOS = '\u0000__adios__\u0000';
    // Duración máxima de un audio, en segundos
    const DURACION_MAX_AUDIO = 30;
    // Si nadie escucha el audio en este tiempo (segundos), se quema igual
    const ESPERA_MAX_AUDIO = 60;
    // Tamaño máximo aceptado para un audio (2 MB), para no recibir archivos gigantes
    const BYTES_MAX_AUDIO = 2 * 1024 * 1024;
    // Grabaciones más cortas que esto (segundos) se descartan (toque accidental)
    const DURACION_MIN_AUDIO = 0.6;
    // Píxeles que hay que deslizar el dedo hacia la izquierda para cancelar
    const DESLIZAR_PARA_CANCELAR = 80;
    // Lado más largo (en píxeles) al que se achica una foto antes de enviarla
    const LADO_MAX_FOTO = 1280;
    // Calidad JPEG de la foto enviada (0 a 1)
    const CALIDAD_FOTO = 0.8;
    // Tamaño máximo aceptado para una foto ya comprimida (3 MB)
    const BYTES_MAX_FOTO = 3 * 1024 * 1024;
    // Tamaño máximo del archivo original que se intenta procesar (30 MB)
    const BYTES_MAX_ORIGINAL = 30 * 1024 * 1024;
    // Si nadie abre la foto en este tiempo (segundos), se quema igual
    const ESPERA_MAX_FOTO = 60;
    // Formatos de imagen que se aceptan al recibir
    const FORMATOS_FOTO = ['image/jpeg', 'image/png', 'image/webp'];

    // ===================== REFERENCIAS AL DOM =====================

    // Contenedor del estado (para cambiar su clase de color)
    const elEstado = document.getElementById('estado');
    // Texto del estado
    const elEstadoTexto = document.getElementById('estado-texto');
    // Panel del link de invitación
    const elPanelLink = document.getElementById('panel-link');
    // Caja donde se escribe la URL
    const elUrl = document.getElementById('url');
    // Botón copiar link
    const elBtnCopiar = document.getElementById('btn-copiar');
    // Zona donde aparece el mensaje
    const elEscenario = document.getElementById('escenario');
    // Texto de "sin mensajes"
    const elVacio = document.getElementById('vacio');
    // Formulario de envío
    const elFormulario = document.getElementById('formulario');
    // Campo de texto
    const elEntrada = document.getElementById('entrada');
    // Botón enviar
    const elBtnEnviar = document.getElementById('btn-enviar');
    // Botón de micrófono
    const elBtnMicro = document.getElementById('btn-micro');
    // Indicador "grabando"
    const elIndicador = document.getElementById('indicador-grabacion');
    // Tiempo que se muestra mientras se graba
    const elTiempoGrabacion = document.getElementById('tiempo-grabacion');
    // Aviso flotante
    const elAviso = document.getElementById('aviso');
    // Botón de foto
    const elBtnFoto = document.getElementById('btn-foto');
    // Selector de archivo oculto
    const elSelectorFoto = document.getElementById('selector-foto');

    // ===================== ESTADO EN MEMORIA =====================

    // Instancia de Peer (nuestra identidad en la red de PeerJS)
    let peer = null;
    // Conexión de datos (DataChannel) con el otro usuario
    let conexion = null;
    // Único mensaje vivo: { elemento, intervalo }. NO hay array de historial.
    let mensaje = null;
    // Mi link de invitación (se guarda solo para el botón copiar)
    let miLink = '';
    // Grabación en curso (o null si no se está grabando)
    let grabacion = null;
    // Temporizador que oculta el aviso flotante
    let temporizadorAviso = null;
    // ¿El navegador puede grabar audio? (micrófono + MediaRecorder)
    const puedeGrabar = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

    // Lee los parámetros de la URL actual
    const parametros = new URLSearchParams(window.location.search);
    // Obtiene el ID al que hay que unirse (o null si no hay ?join=)
    const idParaUnirse = parametros.get('join');

    // ===================== FUNCIONES DE INTERFAZ =====================

    // Cambia el texto y el color del indicador de estado
    function ponerEstado(texto, tipo) {
      // Escribe el texto (textContent evita inyección de HTML)
      elEstadoTexto.textContent = texto;
      // Quita las clases de color anteriores
      elEstado.classList.remove('conectado', 'error');
      // Si se pasó un tipo, agrega la clase correspondiente
      if (tipo) elEstado.classList.add(tipo);
    }

    // Habilita o deshabilita el input y el botón de enviar
    function habilitarChat(habilitado) {
      // Achica el logo mientras hay charla (más lugar para el mensaje) y lo agranda al terminar
      document.querySelector('.app').classList.toggle('en-charla', habilitado);
      // Activa/desactiva el campo de texto
      elEntrada.disabled = !habilitado;
      // Activa/desactiva el botón
      elBtnEnviar.disabled = !habilitado;
      // Activa/desactiva el micrófono (solo si el navegador puede grabar)
      elBtnMicro.disabled = !habilitado || !puedeGrabar;
      // Activa/desactiva el botón de foto
      elBtnFoto.disabled = !habilitado;
      // Si se habilitó, pone el foco en el input para escribir directo
      if (habilitado) elEntrada.focus();
    }

    // Muestra un aviso breve encima del input
    function avisar(texto) {
      // Escribe el texto del aviso
      elAviso.textContent = texto;
      // Lo muestra
      elAviso.classList.remove('oculto');
      // Cancela el ocultado anterior si había uno pendiente
      clearTimeout(temporizadorAviso);
      // Lo oculta a los 2.5 segundos
      temporizadorAviso = setTimeout(function () { elAviso.classList.add('oculto'); }, 2500);
    }

    // Convierte segundos a formato m:ss (por ejemplo 65 → "1:05")
    function formatoTiempo(segundos) {
      // Redondea hacia abajo a segundos enteros (nunca negativo)
      const total = Math.max(0, Math.floor(segundos));
      // Minutos y segundos con dos dígitos
      return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
    }

    // Crea una burbuja vacía y la convierte en el único mensaje vivo
    function prepararBurbuja(deQuien) {
      // Si ya hay un mensaje vivo, lo quema rápido para que solo haya uno
      if (mensaje) destruirMensaje(true);

      // Oculta el texto de "sin mensajes"
      elVacio.classList.add('oculto');

      // Crea el div de la burbuja
      const burbuja = document.createElement('div');
      // Le asigna la clase base y la de propio/ajeno
      burbuja.className = 'burbuja ' + (deQuien === 'yo' ? 'mia' : 'suya');
      // Inserta la burbuja en el escenario
      elEscenario.appendChild(burbuja);

      // Guarda la referencia del único mensaje vivo (sin historial):
      // intervalo = cuenta regresiva, espera = temporizador extra, limpiar = función para liberar recursos
      mensaje = { elemento: burbuja, intervalo: null, espera: null, limpiar: null };
      // Devuelve la burbuja para llenarla
      return burbuja;
    }

    // Muestra un mensaje de texto con su cuenta regresiva
    function mostrarMensaje(texto, deQuien) {
      // Crea la burbuja (y quema la anterior si existía)
      const burbuja = prepararBurbuja(deQuien);
      // Inserta el texto de forma segura (nunca innerHTML con datos del otro)
      burbuja.textContent = texto;
      // Arranca el 5-4-3-2-1
      iniciarCuentaRegresiva();
    }

    // Agrega el contador y la barra al mensaje vivo y arranca el 5-4-3-2-1
    function iniciarCuentaRegresiva() {
      // Si no hay mensaje vivo o ya está contando, no hace nada
      if (!mensaje || mensaje.intervalo) return;
      // Burbuja del mensaje vivo
      const burbuja = mensaje.elemento;

      // Crea el círculo del contador
      const contador = document.createElement('span');
      // Le asigna su clase
      contador.className = 'contador';
      // Empieza mostrando 5
      contador.textContent = SEGUNDOS_DE_VIDA;
      // Lo agrega dentro de la burbuja
      burbuja.appendChild(contador);

      // Crea la barra de progreso
      const barra = document.createElement('span');
      // Le asigna su clase (la animación CSS dura 5s)
      barra.className = 'barra';
      // La agrega dentro de la burbuja
      burbuja.appendChild(barra);

      // Segundos restantes de este mensaje
      let restantes = SEGUNDOS_DE_VIDA;
      // Cada 1 segundo descuenta y actualiza el contador
      const intervalo = setInterval(function () {
        // Resta un segundo
        restantes--;
        // Si todavía queda tiempo…
        if (restantes > 0) {
          // …muestra el nuevo número
          contador.textContent = restantes;
          // Con 2 segundos o menos marca el contador como urgente
          if (restantes <= 2) contador.classList.add('urgente');
        } else {
          // Se acabó el tiempo: quema el mensaje
          destruirMensaje(false);
        }
      }, 1000);

      // Guarda el intervalo para poder frenarlo al destruir
      mensaje.intervalo = intervalo;
    }

    // Muestra un audio efímero. Si es mío, solo la confirmación; si es del otro, el botón "Escuchar"
    function mostrarAudio(blob, duracion, deQuien) {
      // Crea la burbuja (y quema la anterior si existía)
      const burbuja = prepararBurbuja(deQuien);

      // Audio propio: no se puede volver a escuchar, solo se confirma y se quema
      if (deQuien === 'yo') {
        // Texto de confirmación con la duración
        burbuja.textContent = '🎤 Audio enviado · ' + formatoTiempo(duracion);
        // Arranca el 5-4-3-2-1
        iniciarCuentaRegresiva();
        // No hay nada más que hacer
        return;
      }

      // Referencia a este mensaje para saber si sigue siendo el vivo más tarde
      const propio = mensaje;
      // Crea una URL temporal en memoria para el audio recibido
      let url = URL.createObjectURL(blob);
      // Reproductor de audio (no se agrega al DOM, así no hay controles ni opción de descarga)
      const audio = new Audio();
      // Le indica que puede empezar a cargar el audio
      audio.preload = 'auto';
      // Le asigna la URL temporal
      audio.src = url;

      // Botón para escuchar
      const boton = document.createElement('button');
      // Le asigna su clase
      boton.className = 'btn-escuchar';
      // Tipo botón (no envía el formulario)
      boton.type = 'button';
      // Texto con la duración
      boton.textContent = '▶️ Escuchar · ' + formatoTiempo(duracion);
      // Lo agrega a la burbuja
      burbuja.appendChild(boton);

      // Nota aclaratoria
      const nota = document.createElement('span');
      // Le asigna su clase
      nota.className = 'nota-audio';
      // Texto de la nota
      nota.textContent = 'Se escucha una sola vez';
      // La agrega a la burbuja
      burbuja.appendChild(nota);

      // Al destruir el mensaje: frena el audio y libera la memoria
      propio.limpiar = function () {
        // Frena la reproducción
        audio.pause();
        // Quita la fuente del reproductor
        audio.removeAttribute('src');
        // Fuerza al reproductor a soltar el audio
        audio.load();
        // Libera la URL temporal (el audio desaparece de la memoria)
        if (url) URL.revokeObjectURL(url);
        // Suelta la referencia
        url = null;
      };

      // Si nadie lo escucha en ESPERA_MAX_AUDIO segundos, se quema igual
      propio.espera = setTimeout(function () {
        // Solo si sigue siendo el mensaje vivo
        if (mensaje === propio) destruirMensaje(false);
      }, ESPERA_MAX_AUDIO * 1000);

      // Pasa a la cuenta regresiva (después de escuchar o si falla la reproducción)
      const terminar = function (textoFinal) {
        // Si ya no es el mensaje vivo, no hace nada
        if (mensaje !== propio) return;
        // Cancela cualquier temporizador de espera
        clearTimeout(propio.espera);
        // Cambia el texto del botón
        boton.textContent = textoFinal;
        // Arranca el 5-4-3-2-1
        iniciarCuentaRegresiva();
      };

      // Mientras suena, muestra los segundos que faltan
      audio.addEventListener('timeupdate', function () {
        // Usa la duración real si el navegador la conoce; si no, la que mandó el otro
        const total = isFinite(audio.duration) ? audio.duration : duracion;
        // Actualiza el texto del botón
        boton.textContent = '🔊 ' + formatoTiempo(total - audio.currentTime);
      });
      // Cuando termina de sonar, arranca la autodestrucción
      audio.addEventListener('ended', function () { terminar('✓ Escuchado'); });
      // Si el navegador no puede reproducirlo, avisa y lo quema
      audio.addEventListener('error', function () { terminar('⚠️ Tu navegador no puede reproducir este audio'); });

      // Al tocar "Escuchar"…
      boton.addEventListener('click', function () {
        // Se deshabilita: se escucha una sola vez
        boton.disabled = true;
        // Cancela la espera de 60 segundos
        clearTimeout(propio.espera);
        // Respaldo por si el evento "ended" nunca llega (duración + 10 segundos)
        propio.espera = setTimeout(function () { terminar('✓ Escuchado'); }, (duracion + 10) * 1000);
        // Muestra que está sonando
        boton.textContent = '🔊 ' + formatoTiempo(duracion);
        // Reproduce (play devuelve una promesa que puede fallar)
        const promesa = audio.play();
        // Si falla, avisa y lo quema
        if (promesa) promesa.catch(function () { terminar('⚠️ No se pudo reproducir'); });
      });
    }

    // Quema y elimina del DOM el mensaje actual
    function destruirMensaje(rapido) {
      // Si no hay mensaje, no hace nada
      if (!mensaje) return;

      // Copia la referencia al elemento antes de soltar el objeto
      const elemento = mensaje.elemento;
      // Detiene la cuenta regresiva
      clearInterval(mensaje.intervalo);
      // Detiene cualquier temporizador extra (espera de audio)
      clearTimeout(mensaje.espera);
      // Libera recursos extra (por ejemplo, el audio en memoria)
      if (mensaje.limpiar) mensaje.limpiar();
      // Borra la referencia: el mensaje deja de existir en memoria
      mensaje = null;

      // Activa la animación de quemado
      elemento.classList.add('quemando');
      // Si es un reemplazo, usa la versión rápida
      if (rapido) elemento.classList.add('rapido');

      // Función que elimina definitivamente el nodo
      const eliminar = function () {
        // Si el nodo sigue en el DOM, lo quita
        if (elemento.isConnected) elemento.remove();
        // Si no quedó ningún mensaje vivo, vuelve a mostrar el texto vacío
        if (!mensaje) elVacio.classList.remove('oculto');
      };

      // Elimina el nodo al terminar la animación de quemado (solo la de la burbuja)
      elemento.addEventListener('animationend', function (e) {
        // Ignora animaciones de los hijos o del ::after
        if (e.target === elemento && e.animationName === 'quemar') eliminar();
      });
      // Respaldo por si animationend no se dispara (pestaña en segundo plano, etc.)
      setTimeout(eliminar, rapido ? 400 : 1000);
    }

    // Cambia el texto de ayuda que se ve cuando no hay mensajes
    function textoVacio(texto) {
      // Escribe el texto de ayuda
      elVacio.textContent = texto;
    }

    // ===================== CONEXIÓN P2P =====================

    // Configura todos los eventos de una conexión de datos
    function configurarConexion(nuevaConexion) {
      // Si ya estamos hablando con alguien, rechaza a un tercero
      if (conexion && conexion.open) {
        // Cierra la conexión entrante extra
        nuevaConexion.close();
        // No sigue configurando
        return;
      }

      // Guarda la conexión como la conexión activa
      conexion = nuevaConexion;

      // Cuando el canal de datos queda abierto…
      conexion.on('open', function () {
        // Muestra el estado pedido en el enunciado
        ponerEstado('Conectado - mensajes se autodestruyen en 5s', 'conectado');
        // Oculta el panel del link (ya no hace falta)
        elPanelLink.classList.add('oculto');
        // Cambia el texto de ayuda
        textoVacio('Escribí algo. Va a arder en 5 segundos.');
        // Habilita el chat
        habilitarChat(true);
        // Toma la conexión WebRTC interna para vigilar si se cae la red
        const pc = conexion.peerConnection;
        // Si existe, escucha los cambios de estado ICE
        if (pc) pc.addEventListener('iceconnectionstatechange', function () {
          // Si quedó desconectada, fallida o cerrada, damos la charla por terminada
          if (['disconnected', 'failed', 'closed'].includes(pc.iceConnectionState) && conexion) conexion.close();
        });
      });

      // Cuando llega un dato del otro usuario…
      conexion.on('data', function (datos) {
        // Si es la señal de despedida, cerramos la conexión de nuestro lado
        if (datos === SENAL_ADIOS) { conexion.close(); return; }
        // Si es un objeto de tipo audio, lo valida y lo muestra
        if (datos && typeof datos === 'object' && datos.tipo === 'audio') { recibirAudio(datos); return; }
        // Si es un objeto de tipo foto, la valida y la muestra
        if (datos && typeof datos === 'object' && datos.tipo === 'foto') { recibirFoto(datos); return; }
        // Acepta solo texto (ignora cualquier otro tipo de dato)
        if (typeof datos !== 'string') return;
        // Quita espacios y recorta al largo máximo
        const texto = datos.trim().slice(0, LARGO_MAXIMO);
        // Si quedó vacío, lo ignora
        if (!texto) return;
        // Muestra el mensaje como "del otro"
        mostrarMensaje(texto, 'otro');
      });

      // Cuando la conexión se cierra…
      conexion.on('close', function () {
        // Avisa que el otro se fue
        ponerEstado('El otro usuario se desconectó', 'error');
        // Deshabilita el chat
        habilitarChat(false);
        // Quema el mensaje que hubiera en pantalla
        destruirMensaje(true);
        // Si estábamos grabando un audio, lo cancela
        soltarGrabacion(true);
        // Suelta la referencia a la conexión
        conexion = null;
        // Vuelve a mostrar el link para que otro pueda entrar (si seguimos en la red)
        if (miLink) elPanelLink.classList.remove('oculto');
        // Texto de ayuda
        textoVacio('Conversación terminada. Compartí el link para empezar otra.');
      });

      // Si la conexión tiene un error…
      conexion.on('error', function (err) {
        // Lo muestra en el estado
        ponerEstado('Error en la conexión: ' + err.type, 'error');
      });
    }

    // Arranca la app: crea el Peer y decide si espera o se conecta
    function iniciar() {
      // Verifica que PeerJS se haya cargado desde el CDN
      if (typeof Peer === 'undefined') {
        // Si no cargó, avisa (sin internet o CDN bloqueado)
        ponerEstado('No se pudo cargar PeerJS (¿sin internet?)', 'error');
        // Detiene la ejecución
        return;
      }

      // Crea el Peer: el servidor público de PeerJS nos asigna un ID aleatorio
      peer = new Peer();

      // Cuando el servidor nos confirma el ID…
      peer.on('open', function (id) {
        // Arma la URL base sin parámetros ni hash (funciona también abriendo el archivo local)
        const base = window.location.href.split(/[?#]/)[0];
        // Arma el link de invitación con ?join=ID
        miLink = base + '?join=' + encodeURIComponent(id);
        // Muestra el link en pantalla
        elUrl.textContent = miLink;

        // Si la URL traía ?join=ID, nos conectamos a esa persona
        if (idParaUnirse) {
          // Estado mientras se conecta
          ponerEstado('Conectando…');
          // Texto de ayuda
          textoVacio('Conectando con tu contacto…');
          // Abre el DataChannel hacia el otro Peer (reliable = mensajes en orden y sin pérdida)
          configurarConexion(peer.connect(idParaUnirse, { reliable: true }));
        } else {
          // Si no, mostramos el link y esperamos
          elPanelLink.classList.remove('oculto');
          // Estado de espera
          ponerEstado('Esperando a que alguien se conecte…');
        }
      });

      // Cuando alguien abre nuestro link y se conecta a nosotros…
      peer.on('connection', function (conexionEntrante) {
        // Configura esa conexión
        configurarConexion(conexionEntrante);
      });

      // Si perdemos contacto con el servidor de signaling…
      peer.on('disconnected', function () {
        // …y el Peer no fue destruido a propósito, intenta reconectar
        if (peer && !peer.destroyed) peer.reconnect();
      });

      // Manejo de errores del Peer
      peer.on('error', function (err) {
        // El ID al que queremos unirnos no existe (o la otra pestaña se cerró)
        if (err.type === 'peer-unavailable') {
          // Mensaje claro para el usuario
          ponerEstado('El link no es válido o la otra persona ya se fue', 'error');
          // Texto de ayuda
          textoVacio('Pedí un link nuevo o compartí el tuyo.');
          // Muestra nuestro propio link como alternativa
          if (miLink) elPanelLink.classList.remove('oculto');
        } else {
          // Cualquier otro error
          ponerEstado('Error: ' + err.type, 'error');
        }
      });
    }

    // ===================== EVENTOS DE LA INTERFAZ =====================

    // Al enviar el formulario (Enter o botón)…
    elFormulario.addEventListener('submit', function (e) {
      // Evita que la página se recargue
      e.preventDefault();
      // Toma el texto, sin espacios sobrantes y con el largo máximo
      const texto = elEntrada.value.trim().slice(0, LARGO_MAXIMO);
      // Si está vacío o no hay conexión abierta, no hace nada
      if (!texto || !conexion || !conexion.open) return;
      // Envía el texto por el DataChannel directo al otro navegador
      conexion.send(texto);
      // Lo muestra en nuestra pantalla como propio
      mostrarMensaje(texto, 'yo');
      // Limpia el input
      elEntrada.value = '';
      // Mantiene el foco para seguir escribiendo
      elEntrada.focus();
    });

    // Al tocar "Copiar link"…
    elBtnCopiar.addEventListener('click', async function () {
      // Si no hay link todavía, no hace nada
      if (!miLink) return;
      // Intenta copiar o compartir
      try {
        // En móviles con menú nativo de compartir, lo usa
        if (navigator.share && /Mobi|Android/i.test(navigator.userAgent)) {
          // Abre el menú de compartir del sistema
          await navigator.share({ title: 'Chat efímero', url: miLink });
        } else {
          // En escritorio copia al portapapeles
          await navigator.clipboard.writeText(miLink);
          // Feedback visual
          elBtnCopiar.textContent = '¡Copiado!';
          // Vuelve al texto original a los 1.5 segundos
          setTimeout(function () { elBtnCopiar.textContent = 'Copiar link'; }, 1500);
        }
      } catch (err) {
        // Si falla (permiso denegado o compartir cancelado), pide copiarlo a mano
        elBtnCopiar.textContent = 'Seleccioná y copiá el link';
      }
    });

    // ===================== AUDIOS EFÍMEROS =====================

    // Elige un formato de grabación que entiendan tanto iPhone como Android
    function elegirFormato() {
      // Orden de preferencia: AAC en MP4 (lo reproduce todo) y, si no, Opus en WebM
      const candidatos = ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
      // Devuelve el primero que el navegador sepa grabar
      for (const tipo of candidatos) {
        // isTypeSupported indica si MediaRecorder puede grabar en ese formato
        if (MediaRecorder.isTypeSupported(tipo)) return tipo;
      }
      // Si ninguno, deja que el navegador use su formato por defecto
      return '';
    }

    // Empieza a grabar (al apretar el micrófono)
    async function empezarGrabacion() {
      // Si ya se está grabando, o no hay conexión, no hace nada
      if (grabacion || !conexion || !conexion.open) return;
      // Crea el estado de esta grabación (todavía esperando permiso del micrófono)
      const actual = { estado: 'pidiendo', cancelada: false, soltado: false, partes: [] };
      // La marca como la grabación en curso
      grabacion = actual;

      // Pide acceso al micrófono
      let stream;
      // getUserMedia puede fallar si se niega el permiso
      try {
        // Solo audio, con cancelación de eco y supresión de ruido
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      } catch (err) {
        // Sin permiso: libera el estado
        grabacion = null;
        // Avisa al usuario
        avisar('Necesito permiso del micrófono para grabar');
        // Termina
        return;
      }

      // Si soltó el dedo mientras aparecía el cartel de permiso, no grabamos
      if (actual.soltado || grabacion !== actual) {
        // Apaga el micrófono
        stream.getTracks().forEach(function (pista) { pista.stop(); });
        // Libera el estado si sigue siendo el nuestro
        if (grabacion === actual) grabacion = null;
        // Explica cómo se usa
        avisar('Mantené apretado el micrófono para grabar');
        // Termina
        return;
      }

      // Elige el formato
      const formato = elegirFormato();
      // Opciones: 64 kbps es buena calidad de voz y poco peso
      const opciones = formato ? { mimeType: formato, audioBitsPerSecond: 64000 } : { audioBitsPerSecond: 64000 };
      // Crea el grabador
      const grabador = new MediaRecorder(stream, opciones);

      // Guarda el micrófono para apagarlo después
      actual.stream = stream;
      // Guarda el grabador
      actual.grabador = grabador;
      // Marca la hora de inicio
      actual.inicio = Date.now();
      // Ahora sí está grabando
      actual.estado = 'grabando';

      // Cada trozo de audio grabado se junta en "partes" (solo de esta grabación)
      grabador.addEventListener('dataavailable', function (e) {
        // Ignora trozos vacíos
        if (e.data && e.data.size > 0 && actual.partes) actual.partes.push(e.data);
      });
      // Cuando el grabador se detiene, se procesa el audio
      grabador.addEventListener('stop', function () { finalizarGrabacion(actual); });
      // Arranca la grabación
      grabador.start();

      // Muestra el indicador "grabando"
      elIndicador.classList.remove('oculto');
      // Pone el micrófono en rojo
      elBtnMicro.classList.add('grabando');
      // Reinicia el tiempo mostrado
      elTiempoGrabacion.textContent = '0:00';
      // Actualiza el tiempo en pantalla 4 veces por segundo
      actual.reloj = setInterval(function () {
        // Segundos transcurridos
        elTiempoGrabacion.textContent = formatoTiempo((Date.now() - actual.inicio) / 1000);
      }, 250);
      // Al llegar al máximo, se envía solo
      actual.limite = setTimeout(function () { soltarGrabacion(false); }, DURACION_MAX_AUDIO * 1000);
    }

    // Termina la grabación: cancelar = true la descarta, false la envía
    function soltarGrabacion(cancelar) {
      // Grabación en curso
      const actual = grabacion;
      // Si no hay ninguna, no hace nada
      if (!actual) return;
      // Marca que el dedo ya se soltó
      actual.soltado = true;
      // Marca si hay que descartarla
      if (cancelar) actual.cancelada = true;
      // Si todavía estaba pidiendo permiso, empezarGrabacion se encarga
      if (actual.estado !== 'grabando') return;
      // Pasa a estado "deteniendo" para no detener dos veces
      actual.estado = 'deteniendo';
      // Frena el reloj en pantalla
      clearInterval(actual.reloj);
      // Frena el límite de 30 segundos
      clearTimeout(actual.limite);
      // Oculta el indicador
      elIndicador.classList.add('oculto');
      // Vuelve el micrófono a gris
      elBtnMicro.classList.remove('grabando');
      // Detiene el grabador (dispara "stop" → finalizarGrabacion)
      actual.grabador.stop();
    }

    // Procesa el audio grabado y lo envía (o lo descarta)
    function finalizarGrabacion(actual) {
      // Apaga el micrófono (se apaga la luz/indicador del sistema)
      actual.stream.getTracks().forEach(function (pista) { pista.stop(); });
      // Ya no hay grabación en curso
      if (grabacion === actual) grabacion = null;

      // Duración real en segundos
      const duracion = (Date.now() - actual.inicio) / 1000;
      // Formato real que usó el grabador
      const tipo = actual.grabador.mimeType || 'audio/webm';
      // Une todos los trozos en un solo archivo en memoria
      const blob = new Blob(actual.partes, { type: tipo });
      // Suelta los trozos
      actual.partes = null;

      // Si se canceló, se descarta
      if (actual.cancelada) { avisar('Audio cancelado'); return; }
      // Si fue un toque accidental, se descarta
      if (duracion < DURACION_MIN_AUDIO) { avisar('Mantené apretado para grabar'); return; }
      // Si se cortó la conexión mientras grababa, se descarta
      if (!conexion || !conexion.open) return;
      // Si pesa demasiado (no debería con 30 s a 64 kbps), se descarta
      if (blob.size > BYTES_MAX_AUDIO) { avisar('El audio es demasiado largo'); return; }

      // Convierte el audio a bytes para mandarlo por el DataChannel
      blob.arrayBuffer().then(function (bytes) {
        // Verifica de nuevo que la conexión siga abierta
        if (!conexion || !conexion.open) return;
        // Envía un objeto con tipo, formato, duración y los bytes
        conexion.send({ tipo: 'audio', formato: tipo, duracion: Math.round(duracion * 10) / 10, datos: bytes });
        // Muestra la confirmación en nuestra pantalla
        mostrarAudio(null, duracion, 'yo');
      });
    }

    // Valida un audio que llegó del otro usuario y lo muestra
    function recibirAudio(datos) {
      // Los bytes pueden llegar como ArrayBuffer o como vista (Uint8Array)
      const bytes = datos.datos;
      // Si no son bytes, se ignora
      if (!(bytes instanceof ArrayBuffer) && !ArrayBuffer.isView(bytes)) return;
      // Si pesan demasiado, se ignora
      if (bytes.byteLength > BYTES_MAX_AUDIO) return;
      // El formato tiene que ser un texto corto que empiece con "audio/"
      if (typeof datos.formato !== 'string' || datos.formato.length > 60 || !datos.formato.startsWith('audio/')) return;
      // La duración tiene que ser un número razonable
      const duracion = Number(datos.duracion);
      // Si no es válida, se ignora
      if (!isFinite(duracion) || duracion < 0 || duracion > DURACION_MAX_AUDIO + 5) return;
      // Arma el audio en memoria
      const blob = new Blob([bytes], { type: datos.formato });
      // Lo muestra como "del otro"
      mostrarAudio(blob, duracion, 'otro');
    }

    // Posición X donde se apoyó el dedo (para detectar "deslizar para cancelar")
    let inicioToqueX = 0;

    // Al apoyar el dedo (o el mouse) sobre el micrófono…
    elBtnMicro.addEventListener('pointerdown', function (e) {
      // Si está deshabilitado, no hace nada
      if (elBtnMicro.disabled) return;
      // Evita el foco y la selección
      e.preventDefault();
      // Captura el puntero: los eventos siguen llegando aunque el dedo salga del botón
      try { elBtnMicro.setPointerCapture(e.pointerId); } catch (err) { /* algunos navegadores viejos no lo soportan */ }
      // Guarda dónde se apoyó
      inicioToqueX = e.clientX;
      // Empieza a grabar
      empezarGrabacion();
    });

    // Al mover el dedo…
    elBtnMicro.addEventListener('pointermove', function (e) {
      // Si se deslizó lo suficiente hacia la izquierda, cancela
      if (grabacion && inicioToqueX - e.clientX > DESLIZAR_PARA_CANCELAR) soltarGrabacion(true);
    });

    // Al levantar el dedo, se envía
    elBtnMicro.addEventListener('pointerup', function () { soltarGrabacion(false); });
    // Si el sistema interrumpe el toque (llamada entrante, etc.), se cancela
    elBtnMicro.addEventListener('pointercancel', function () { soltarGrabacion(true); });
    // Evita el menú contextual al mantener apretado en móviles
    elBtnMicro.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // Si el navegador no puede grabar, el botón lo explica al tocarlo
    if (!puedeGrabar) elBtnMicro.title = 'Tu navegador no permite grabar audio';

    // ===================== FOTOS "VER UNA VEZ" =====================

    // Carga un archivo de imagen en un elemento <img> (devuelve una promesa)
    function cargarImagen(archivo) {
      // Promesa que se resuelve cuando la imagen termina de cargar
      return new Promise(function (resolver, rechazar) {
        // URL temporal del archivo elegido
        const url = URL.createObjectURL(archivo);
        // Elemento imagen (no se agrega a la página)
        const img = new Image();
        // Si carga bien…
        img.onload = function () {
          // …libera la URL temporal y devuelve la imagen
          URL.revokeObjectURL(url);
          // Devuelve la imagen cargada
          resolver(img);
        };
        // Si no se puede leer (formato no soportado, archivo roto)…
        img.onerror = function () {
          // …libera la URL temporal y avisa del error
          URL.revokeObjectURL(url);
          // Rechaza la promesa
          rechazar(new Error('imagen ilegible'));
        };
        // Empieza a cargar
        img.src = url;
      });
    }

    // Achica y recomprime la foto a JPEG (esto también borra los metadatos: GPS, modelo, fecha)
    async function comprimirFoto(archivo) {
      // Carga la imagen (los navegadores actuales ya la giran según la orientación EXIF)
      const img = await cargarImagen(archivo);
      // Factor de escala para que el lado más largo no pase de LADO_MAX_FOTO
      const escala = Math.min(1, LADO_MAX_FOTO / Math.max(img.naturalWidth, img.naturalHeight));
      // Ancho final en píxeles
      const ancho = Math.max(1, Math.round(img.naturalWidth * escala));
      // Alto final en píxeles
      const alto = Math.max(1, Math.round(img.naturalHeight * escala));
      // Lienzo donde se dibuja la versión achicada
      const lienzo = document.createElement('canvas');
      // Le da el ancho final
      lienzo.width = ancho;
      // Le da el alto final
      lienzo.height = alto;
      // Contexto 2D para dibujar
      const ctx = lienzo.getContext('2d');
      // Fondo blanco (si la imagen era PNG transparente, en JPEG quedaría negro)
      ctx.fillStyle = '#ffffff';
      // Pinta el fondo
      ctx.fillRect(0, 0, ancho, alto);
      // Dibuja la imagen achicada
      ctx.drawImage(img, 0, 0, ancho, alto);
      // Convierte el lienzo a un archivo JPEG en memoria
      const blob = await new Promise(function (resolver) { lienzo.toBlob(resolver, 'image/jpeg', CALIDAD_FOTO); });
      // Libera la memoria del lienzo
      lienzo.width = lienzo.height = 0;
      // Si no se pudo convertir, error
      if (!blob) throw new Error('no se pudo comprimir');
      // Devuelve el JPEG
      return blob;
    }

    // Procesa y envía la foto elegida
    async function enviarFoto(archivo) {
      // Si no hay conexión, no hace nada
      if (!conexion || !conexion.open) return;
      // Si no es una imagen, avisa
      if (!archivo.type.startsWith('image/')) { avisar('Eso no es una imagen'); return; }
      // Si el original es gigante, avisa
      if (archivo.size > BYTES_MAX_ORIGINAL) { avisar('La imagen es demasiado grande'); return; }
      // Avisa que está trabajando
      avisar('Enviando foto…');
      // La compresión puede fallar
      let blob;
      // Intenta comprimir
      try {
        // Achica y recomprime
        blob = await comprimirFoto(archivo);
      } catch (err) {
        // Por ejemplo, fotos HEIC en navegadores que no las entienden
        avisar('No se pudo leer esa imagen');
        // Termina
        return;
      }
      // Si aun comprimida pesa demasiado, avisa
      if (blob.size > BYTES_MAX_FOTO) { avisar('La imagen es demasiado pesada'); return; }
      // Convierte a bytes para el DataChannel
      const bytes = await blob.arrayBuffer();
      // Verifica de nuevo la conexión (pudo cortarse mientras se comprimía)
      if (!conexion || !conexion.open) return;
      // Envía un objeto con tipo, formato y los bytes
      conexion.send({ tipo: 'foto', formato: 'image/jpeg', datos: bytes });
      // Oculta el aviso "Enviando foto…"
      elAviso.classList.add('oculto');
      // Muestra la confirmación en nuestra pantalla
      mostrarFoto(null, 'yo');
    }

    // Valida una foto que llegó del otro usuario y la muestra
    function recibirFoto(datos) {
      // Los bytes pueden llegar como ArrayBuffer o como vista (Uint8Array)
      const bytes = datos.datos;
      // Si no son bytes, se ignora
      if (!(bytes instanceof ArrayBuffer) && !ArrayBuffer.isView(bytes)) return;
      // Si pesan demasiado, se ignora
      if (bytes.byteLength > BYTES_MAX_FOTO) return;
      // Solo formatos de imagen conocidos (nunca SVG ni otros)
      if (!FORMATOS_FOTO.includes(datos.formato)) return;
      // Arma la imagen en memoria
      const blob = new Blob([bytes], { type: datos.formato });
      // La muestra como "del otro"
      mostrarFoto(blob, 'otro');
    }

    // Muestra una foto efímera. Si es mía, solo la confirmación; si es del otro, se ve manteniendo apretado
    function mostrarFoto(blob, deQuien) {
      // Crea la burbuja (y quema la anterior si existía)
      const burbuja = prepararBurbuja(deQuien);

      // Foto propia: solo se confirma y se quema
      if (deQuien === 'yo') {
        // Texto de confirmación
        burbuja.textContent = '📷 Foto enviada';
        // Arranca el 5-4-3-2-1
        iniciarCuentaRegresiva();
        // No hay nada más que hacer
        return;
      }

      // Referencia a este mensaje para saber si sigue siendo el vivo más tarde
      const propio = mensaje;
      // Lienzo donde se dibuja la foto con la marca de agua (se crea al terminar de cargar)
      let lienzo = null;
      // ¿Ya se empezó a ver? (la cuenta regresiva arranca con el primer toque)
      let iniciada = false;

      // Marco que contiene la foto y la tapa (es la zona que hay que mantener apretada)
      const marco = document.createElement('div');
      // Le asigna su clase
      marco.className = 'marco-foto';
      // Se puede enfocar con el teclado (para usarlo con la barra espaciadora en la PC)
      marco.tabIndex = 0;
      // Descripción para lectores de pantalla
      marco.setAttribute('aria-label', 'Foto efímera: mantené apretado para verla');
      // Lo agrega a la burbuja
      burbuja.appendChild(marco);

      // Tapa que cubre la foto cuando no se está apretando
      const tapa = document.createElement('span');
      // Le asigna su clase
      tapa.className = 'tapa-foto';
      // Texto mientras carga
      tapa.textContent = 'Cargando foto…';
      // La agrega al marco
      marco.appendChild(tapa);

      // Nota aclaratoria
      const nota = document.createElement('span');
      // Le asigna su clase
      nota.className = 'nota-audio';
      // Texto de la nota
      nota.textContent = 'Se ve una sola vez · ' + SEGUNDOS_DE_VIDA + ' s';
      // La agrega a la burbuja
      burbuja.appendChild(nota);

      // Evita el menú contextual (guardar imagen) sobre toda la burbuja
      burbuja.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      // Al destruir el mensaje: borra los píxeles de la foto
      propio.limpiar = function () {
        // Copia la referencia al lienzo
        const l = lienzo;
        // Suelta la referencia
        lienzo = null;
        // Borra los píxeles después de la animación de quemado (así se ve arder)
        if (l) setTimeout(function () { l.width = 0; l.height = 0; }, 1000);
      };

      // Si nadie la abre en ESPERA_MAX_FOTO segundos, se quema igual
      propio.espera = setTimeout(function () {
        // Solo si sigue siendo el mensaje vivo
        if (mensaje === propio) destruirMensaje(false);
      }, ESPERA_MAX_FOTO * 1000);

      // Decodifica la foto y la dibuja en un lienzo con la marca de agua
      // (cargarImagen libera su URL temporal enseguida: después la foto solo existe en el lienzo)
      cargarImagen(blob).then(function (img) {
        // Si ya no es el mensaje vivo, no hace nada
        if (mensaje !== propio) return;
        // Dibuja la foto + marca de agua
        lienzo = dibujarConMarcaDeAgua(img);
        // Le asigna su clase
        lienzo.className = 'foto-efimera';
        // Lo agrega al marco, debajo de la tapa
        marco.insertBefore(lienzo, tapa);
        // Ahora indica cómo verla
        tapa.textContent = '👆 Mantené apretado para ver';
      }).catch(function () {
        // Si ya no es el mensaje vivo, no hace nada
        if (mensaje !== propio) return;
        // Avisa en la tapa
        tapa.textContent = '⚠️ No se pudo mostrar la foto';
        // Cancela la espera de 60 segundos
        clearTimeout(propio.espera);
        // Y la quema
        iniciarCuentaRegresiva();
      });

      // Muestra la foto (mientras se mantiene apretado)
      const mostrar = function () {
        // Si todavía no cargó o ya no es el mensaje vivo, no hace nada
        if (!lienzo || mensaje !== propio) return;
        // Si la ventana está desenfocada (posible captura), no la muestra
        if (document.body.classList.contains('desenfocado')) return;
        // Destapa la foto
        marco.classList.add('viendo');
        // La primera vez arranca la autodestrucción
        if (!iniciada) {
          // Marca que ya empezó
          iniciada = true;
          // Cancela la espera de 60 segundos
          clearTimeout(propio.espera);
          // Marca que hay una foto abierta (para quemarla si se cambia de app)
          propio.fotoVisible = true;
          // Cambia el texto de la tapa
          tapa.textContent = '👆 Mantené apretado';
          // Arranca el 5-4-3-2-1 (corre aunque se suelte el dedo)
          iniciarCuentaRegresiva();
        }
      };

      // Tapa la foto (al soltar)
      const tapar = function () {
        // Vuelve a cubrir la foto
        marco.classList.remove('viendo');
      };

      // Al apoyar el dedo (o el mouse) sobre la foto…
      marco.addEventListener('pointerdown', function (e) {
        // Evita selección y menús
        e.preventDefault();
        // Captura el puntero para recibir el "soltar" aunque el dedo se mueva
        try { marco.setPointerCapture(e.pointerId); } catch (err) { /* navegadores viejos */ }
        // Muestra la foto
        mostrar();
      });
      // Al levantar el dedo, se tapa
      marco.addEventListener('pointerup', tapar);
      // Si el sistema interrumpe el toque (por ejemplo, al apretar los botones de captura), se tapa
      marco.addEventListener('pointercancel', tapar);
      // Si se pierde la captura del puntero, se tapa
      marco.addEventListener('lostpointercapture', tapar);
      // Con teclado: mantener la barra espaciadora o Enter
      marco.addEventListener('keydown', function (e) {
        // Solo esas dos teclas
        if (e.key === ' ' || e.key === 'Enter') {
          // Evita que la página haga scroll
          e.preventDefault();
          // Muestra la foto
          mostrar();
        }
      });
      // Al soltar la tecla, se tapa
      marco.addEventListener('keyup', tapar);
      // Si el marco pierde el foco, se tapa
      marco.addEventListener('blur', tapar);
    }

    // Código corto que identifica a quien está viendo (las primeras letras de su ID de Peer)
    function codigoSesion() {
      // Si todavía no hay ID, guiones
      if (!peer || !peer.id) return '------';
      // Primeros 6 caracteres sin guiones, en mayúsculas
      return peer.id.replace(/-/g, '').slice(0, 6).toUpperCase();
    }

    // Dibuja la foto en un lienzo y le pinta encima una marca de agua diagonal repetida
    function dibujarConMarcaDeAgua(img) {
      // Crea el lienzo
      const lienzo = document.createElement('canvas');
      // Mismo ancho que la foto
      lienzo.width = img.naturalWidth;
      // Mismo alto que la foto
      lienzo.height = img.naturalHeight;
      // Contexto 2D para dibujar
      const ctx = lienzo.getContext('2d');
      // Dibuja la foto
      ctx.drawImage(img, 0, 0);

      // Fecha y hora actuales
      const ahora = new Date();
      // Arma la fecha corta con dos dígitos (por ejemplo 25/10 14:32)
      const fecha = String(ahora.getDate()).padStart(2, '0') + '/' + String(ahora.getMonth() + 1).padStart(2, '0') + ' ' +
        String(ahora.getHours()).padStart(2, '0') + ':' + String(ahora.getMinutes()).padStart(2, '0');
      // Texto de la marca de agua
      const texto = '🔥 Visto por ' + codigoSesion() + ' · ' + fecha;

      // Tamaño de letra proporcional a la foto (mínimo 16 px)
      const tamano = Math.max(16, Math.round(Math.max(lienzo.width, lienzo.height) / 32));
      // Fuente en negrita
      ctx.font = 'bold ' + tamano + 'px sans-serif';
      // Relleno blanco semitransparente
      ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
      // Borde negro semitransparente (para que se lea en fotos claras y oscuras)
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.28)';
      // Grosor del borde
      ctx.lineWidth = Math.max(1, tamano / 12);
      // Ancho del texto más un espacio
      const paso = ctx.measureText(texto).width + tamano * 2;
      // Diagonal de la foto (para cubrirla entera aunque el texto esté girado)
      const diagonal = Math.hypot(lienzo.width, lienzo.height);

      // Guarda el estado del contexto
      ctx.save();
      // Mueve el origen al centro de la foto
      ctx.translate(lienzo.width / 2, lienzo.height / 2);
      // Gira -30 grados
      ctx.rotate(-Math.PI / 6);
      // Número de fila (para desfasar filas alternas)
      let fila = 0;
      // Recorre filas desde arriba hasta abajo
      for (let y = -diagonal / 2; y < diagonal / 2; y += tamano * 4) {
        // Desfasa las filas impares media palabra (patrón en ladrillo)
        const desfase = (fila % 2) * (paso / 2);
        // Recorre columnas de izquierda a derecha
        for (let x = -diagonal / 2 - desfase; x < diagonal / 2; x += paso) {
          // Borde del texto
          ctx.strokeText(texto, x, y);
          // Relleno del texto
          ctx.fillText(texto, x, y);
        }
        // Pasa a la fila siguiente
        fila++;
      }
      // Restaura el estado del contexto
      ctx.restore();
      // Devuelve el lienzo listo
      return lienzo;
    }

    // Al tocar el botón de foto, abre el selector (cámara o galería)
    elBtnFoto.addEventListener('click', function () {
      // Solo si hay conexión
      if (conexion && conexion.open) elSelectorFoto.click();
    });

    // Cuando se elige una foto…
    elSelectorFoto.addEventListener('change', function () {
      // Toma el primer archivo elegido
      const archivo = elSelectorFoto.files && elSelectorFoto.files[0];
      // Limpia el selector (así se puede elegir la misma foto otra vez y no queda guardada)
      elSelectorFoto.value = '';
      // Si eligió algo, lo envía
      if (archivo) enviarFoto(archivo);
    });

    // Si la pestaña se oculta (cambio de app, multitarea) con una foto a la vista, se quema al instante
    document.addEventListener('visibilitychange', function () {
      // Al ocultarse, también desenfoca (para la miniatura de la multitarea)
      if (document.hidden) desenfocar();
      // Solo cuando se oculta y hay una foto visible
      if (document.hidden && mensaje && mensaje.fotoVisible) destruirMensaje(true);
    });

    // ===================== DESENFOQUE AL PERDER EL FOCO =====================

    // Desenfoca los mensajes (la ventana dejó de estar al frente)
    function desenfocar() {
      // Agrega la clase que aplica el desenfoque por CSS
      document.body.classList.add('desenfocado');
    }

    // Vuelve a enfocar los mensajes
    function enfocar() {
      // Quita la clase de desenfoque
      document.body.classList.remove('desenfocado');
    }

    // La ventana pierde el foco: herramienta de recortes (Win+Shift+S), otra app, notificación, etc.
    window.addEventListener('blur', desenfocar);
    // La ventana vuelve a tener el foco
    window.addEventListener('focus', enfocar);
    // Respaldo: si el usuario toca la página, es que la está usando (algunos móviles no avisan "focus")
    document.addEventListener('pointerdown', enfocar, true);

    // ===================== LIMPIEZA AL CERRAR =====================

    // Destruye todo cuando se cierra o se oculta definitivamente la pestaña
    function destruirTodo() {
      // Quema/borra el mensaje vivo
      if (mensaje) destruirMensaje(true);
      // Cancela cualquier grabación en curso y apaga el micrófono
      soltarGrabacion(true);
      // Avisa al otro que nos vamos (así su pantalla se actualiza al instante)
      if (conexion && conexion.open) { try { conexion.send(SENAL_ADIOS); } catch (e) { /* si falla, no importa */ } }
      // Cierra el DataChannel
      if (conexion) conexion.close();
      // Destruye el Peer (libera el ID en el servidor)
      if (peer && !peer.destroyed) peer.destroy();
      // Suelta todas las referencias
      conexion = null;
      // Suelta el Peer
      peer = null;
    }

    // pagehide funciona mejor que beforeunload en móviles (iOS/Android)
    window.addEventListener('pagehide', destruirTodo);
    // beforeunload como respaldo en escritorio
    window.addEventListener('beforeunload', destruirTodo);

    // ===================== ARRANQUE =====================

    // Inicia la app
    iniciar();
  </script>
  <!-- Fin de la lógica -->
</body>
</html>
